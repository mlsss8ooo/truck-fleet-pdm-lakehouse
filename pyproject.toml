[project]
name = "fleet_pdm"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pyspark>=4.0,<4.1",
    "chispa>=0.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_pdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/fleet_pdm"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Databricks entrypoints: `spark`/`dbutils` are injected globals
"pipelines/**" = ["E402", "F821"]
"notebooks/**" = ["E402", "F821"]
